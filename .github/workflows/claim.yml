name: Claim Epic Free Games

on:
  schedule:
    - cron: '0 16 * * 4'
    - cron: '0 4 * * 5'
  workflow_dispatch: {}

jobs:
  claim:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore browser profile (login session)
        uses: actions/cache@v4
        with:
          path: data/browser
          key: fgc-browser-${{ github.run_id }}
          restore-keys: |
            fgc-browser-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firefox
        run: npx playwright install firefox --with-deps

      - name: Install apprise (notifications)
        run: pip install apprise

      - name: Claim Epic Games free games
        id: claim
        env:
          EG_EMAIL: ${{ secrets.EG_EMAIL }}
          EG_PASSWORD: ${{ secrets.EG_PASSWORD }}
          EG_OTPKEY: ${{ secrets.EG_OTPKEY }}
          NOTIFY: ${{ secrets.NOTIFY }}
          TIME: 1
          RECORD: 1
        run: node epic-games.js

      - name: Upload screenshots and browser data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-data
          path: |
            data/screenshots
            data/browser
          retention-days: 7
