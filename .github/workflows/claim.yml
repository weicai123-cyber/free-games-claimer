name: Claim Epic Free Games

on:
  schedule:
    # Epic 每周四 23:00 (北京时间) 换免费游戏，北京时间周五早上跑
    # cron 是 UTC 时间: 周四 16:00 UTC = 周五 00:00 北京
    - cron: '0 16 * * 4'
    - cron: '0 4 * * 5'   # 周五中午 12 点北京再补一次，防失败
  workflow_dispatch: {}   # 允许手动触发（调试用）

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore browser profile (login session)
        uses: actions/cache@v4
        with:
          path: data/browser
          key: fgc-browser-${{ github.run_id }}
          restore-keys: |
            fgc-browser-

      - name: Restore claimed games data
        uses: actions/cache@v4
        with:
          path: data
          key: fgc-data-${{ github.run_id }}
          restore-keys: |
            fgc-data-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm`n          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Firefox
        run: npx playwright install firefox --with-deps

      - name: Install apprise (notifications)
        run: pip install apprise

      - name: Claim Epic Games free games
        env:
          EG_EMAIL: ${{ secrets.EG_EMAIL }}
          EG_PASSWORD: ${{ secrets.EG_PASSWORD }}
          EG_OTPKEY: ${{ secrets.EG_OTPKEY }}
          NOTIFY: ${{ secrets.NOTIFY }}
          TIME: 1
        run: node epic-games.js

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: data/screenshots
          retention-days: 7


